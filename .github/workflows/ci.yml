name: CI

# PR 与发布共用候选计划；静态检查始终执行，其他作业按输入责任选择。
# template-matrix 保留必过检查名，严格核对作业状态、候选与回执。
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      quality_base_sha:
        type: string
        default: ''
      release_channel:
        type: string
        default: ''
      release_base_tag:
        type: string
        default: ''
      release_base_sha:
        type: string
        default: ''
      expected_plan:
        type: string
        default: ''
    outputs:
      validation_plan:
        value: ${{ jobs.template-matrix.outputs.validation_plan }}

permissions:
  contents: read
  actions: read

# 直接 PR 请求 core 范围：planner 能证明时收窄为 core 档（代表场景加改动条件分支），否则退回 full。
# PR 有意不承担全局覆盖；full 在 develop/main 推送、夜间与发布时由 release.yml 复用本工作流执行。
# 计划的 Tier 才是本次实际档位，下游作业一律读计划，不另行推断。
env:
  PLAN_SCOPE: ${{ github.event_name == 'pull_request' && !inputs.candidate_sha && 'core' || 'full' }}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-sync:
    name: 文档与 Skill 同步闸门
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 安装 Skill 校验依赖
        run: python -m pip install PyYAML==6.0.3
      # 闸门清单的唯一来源是 check-all.ps1；新增闸门只改那一处，本文件不必跟着改
      - name: 全部静态闸门
        shell: pwsh
        run: pwsh scripts/check-all.ps1

  docs-sync-windows:
    name: 文档与 Skill 同步闸门（Windows）
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 安装 Skill 校验依赖
        run: python -m pip install PyYAML==6.0.3
      # 与 docs-sync 同一入口；Windows 上通常只有 python，check-all.ps1 自行探测解释器
      - name: 全部静态闸门
        shell: pwsh
        run: pwsh scripts/check-all.ps1

  frontend-gates:
    name: 前端依赖闸门
    needs: quality-plan
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['frontend-gates']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            template/frontend/package-lock.json
            template/.template.config/localization/frontend/package-lock.json
      # 这些闸门借生成项目的 node_modules（模板源码的 package.json 带条件行，不能直接安装）。
      # 每次现生成、现安装，不依赖任何残留；缺依赖或版本不一致时脚本直接失败，不跳过。
      - name: 生成项目并安装前端依赖
        shell: pwsh
        run: |
          dotnet new install ./template --debug:custom-hive .tmp/browser-tools-hive --force
          if ($LASTEXITCODE -ne 0) { throw '模板安装失败' }
          dotnet new fullstack-app -n Ci.Tools -o .tmp/browser-tools --debug:custom-hive .tmp/browser-tools-hive
          if ($LASTEXITCODE -ne 0) { throw '生成项目失败' }
          npm ci --prefix .tmp/browser-tools/frontend
          if ($LASTEXITCODE -ne 0) { throw '前端依赖安装失败' }
      - name: Spartan 定制登记规则自检
        run: node scripts/check-spartan-customizations.mjs --self-test .tmp/browser-tools/frontend
      - name: Spartan 定制与登记表一致
        run: node scripts/check-spartan-customizations.mjs .tmp/browser-tools/frontend
      - name: 模板 ESLint 规则自检
        run: node scripts/test-template-eslint-rules.mjs .tmp/browser-tools/frontend

  template-slices:
    name: 模板场景 · ${{ matrix.slice.title }}
    needs: [quality-plan, framework-pack]
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['template-slices']
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slice: ${{ fromJSON(needs.quality-plan.outputs.slices) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            template/frontend/package-lock.json
            template/.template.config/localization/frontend/package-lock.json
      # 前端单测跑在 Playwright 的 Chromium 里；版本取模板锁文件，与生成项目实际安装的一致
      - name: 安装单测用的 Chromium
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Mode != 'backend'
        shell: pwsh
        run: |
          dotnet new install ./template --debug:custom-hive .tmp/browser-tools-hive --force
          if ($LASTEXITCODE -ne 0) { throw '浏览器工具模板安装失败' }
          dotnet new fullstack-app -n Ci.Tools -o .tmp/browser-tools --debug:custom-hive .tmp/browser-tools-hive
          if ($LASTEXITCODE -ne 0) { throw '浏览器工具依赖生成失败' }
          $version = (Get-Content .tmp/browser-tools/frontend/package-lock.json -Raw | ConvertFrom-Json -AsHashTable).packages['node_modules/playwright'].version
          if (-not $version) { throw '模板锁文件里没有 playwright' }
          npx --yes "playwright@$version" install --with-deps chromium
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v8
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      # 第三方 NuGet 包的 HTTP 下载缓存（键为全部 Directory.Packages.props）；Leistd.* 只走候选包源，
      # 恢复后与保存前都删掉缓存里的 Leistd 条目，矩阵的解包目录仍按 run 隔离，候选来源断言不受影响。
      - name: 恢复第三方 NuGet 下载缓存
        uses: actions/cache@v6
        with:
          path: ~/.local/share/NuGet/http-cache
          key: nuget-http-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-http-${{ runner.os }}-
      - name: 缓存中不保留 Leistd 包
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - name: 生成并验证本片全部场景
        id: matrix
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.quality-plan.outputs.validation_plan }}
        run: |
          $env:VALIDATION_PLAN | Set-Content .tmp/quality-plan.json -Encoding utf8
          $tier = ($env:VALIDATION_PLAN | ConvertFrom-Json).Tier
          # 同候选源码预检由 docs-sync 承担；汇总必须核对其成功，不能用跳过代替通过。
          pwsh scripts/test-template-matrix.ps1 -SkipPack -SkipSourcePreflight -ValidationPlanPath .tmp/quality-plan.json -Tier $tier -Slice '${{ matrix.slice.key }}'
          if ($LASTEXITCODE -ne 0) { throw '模板矩阵失败' }
      - name: 保存前清除 Leistd 缓存条目
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - name: 保留完整场景结果
        uses: actions/upload-artifact@v7
        with:
          name: template-matrix-${{ matrix.slice.key }}
          overwrite: true
          path: ${{ steps.matrix.outputs.results_path }}
          if-no-files-found: error

  quality-plan:
    name: 计算候选验证责任
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validation_plan: ${{ steps.plan.outputs.validation_plan }}
      slices: ${{ steps.plan.outputs.slices }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: 独立计算并核对候选计划
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CALLER_BASE_SHA: ${{ inputs.quality_base_sha }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          RELEASE_BASE_TAG: ${{ inputs.release_base_tag }}
          RELEASE_BASE_SHA: ${{ inputs.release_base_sha }}
          EXPECTED_PLAN: ${{ inputs.expected_plan }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          if os.environ['CANDIDATE_SHA'] and os.environ['CALLER_BASE_SHA'] != os.environ['PR_BASE_SHA']:
              raise ValueError('Caller quality baseline differs from triggering event')
          arguments = ['python3', 'scripts/plan-quality-checks.py', '--tier', os.environ['PLAN_SCOPE'],
                       '--output', '.tmp/quality-plan.json', '--github-output']
          if os.environ['RELEASE_CHANNEL']:
              arguments += ['--release-channel', os.environ['RELEASE_CHANNEL'],
                            '--release-base-tag', os.environ['RELEASE_BASE_TAG'],
                            '--release-base-sha', os.environ['RELEASE_BASE_SHA']]
          if os.environ['EXPECTED_PLAN']:
              expected = Path('.tmp/expected-plan.json')
              expected.parent.mkdir(parents=True, exist_ok=True)
              expected.write_text(os.environ['EXPECTED_PLAN'], encoding='utf-8')
              arguments += ['--expected-plan', str(expected)]
          elif os.environ['CANDIDATE_SHA']:
              raise ValueError('Reusable candidate requires an expected plan')
          subprocess.run(arguments, check=True)
          PY

  framework-pack:
    name: 打包候选 Framework
    needs: quality-plan
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['framework-pack']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_version: ${{ steps.pack.outputs.candidate_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # 候选版本带本次运行的唯一后缀，永不等于已发布版本；candidate.json 记录版本与 SDK
      - name: 打包当前 Framework
        id: pack
        shell: pwsh
        run: |
          pwsh framework/build/pack-local-feed.ps1 -VersionSuffix 'ci.${{ github.run_id }}.${{ github.run_attempt }}'
          if ($LASTEXITCODE -ne 0) { throw '候选 Framework 打包失败' }
          $candidate = Get-Content .tmp/local-feed/candidate.json -Raw | ConvertFrom-Json
          "candidate_version=$($candidate.CandidateVersion)" | Out-File $env:GITHUB_OUTPUT -Append
          "候选 Framework 包：$($candidate.CandidateVersion)（SDK $($candidate.Sdk)）" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - name: 保留同一候选包源
        uses: actions/upload-artifact@v7
        with:
          name: candidate-framework-feed
          overwrite: true
          path: |
            .tmp/local-feed/*.nupkg
            .tmp/local-feed/candidate.json
          if-no-files-found: error

  package-consumption:
    name: NuGet 包内容与隔离消费
    needs: [quality-plan, framework-pack]
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['package-consumption']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v8
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      - name: 恢复第三方 NuGet 下载缓存
        uses: actions/cache@v6
        with:
          path: ~/.local/share/NuGet/http-cache
          key: nuget-http-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-http-${{ runner.os }}-
      - name: 缓存中不保留 Leistd 包
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - name: 核对全部包并消费影响闭包
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.quality-plan.outputs.validation_plan }}
        run: |
          $env:VALIDATION_PLAN | Set-Content .tmp/quality-plan.json -Encoding utf8
          pwsh framework/build/test-package-consumption.ps1 -ValidationPlanPath .tmp/quality-plan.json
          if ($LASTEXITCODE -ne 0) { throw 'NuGet 包消费失败' }
      - name: 保存前清除 Leistd 缓存条目
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: package-content-proof
          path: .tmp/package-consumer/package-results.json
          if-no-files-found: error

  # 证明拆成互不引用产物的四片：三片按序号取模生成 320 个形态，对照片承担 768 组输入映射、
  # 角色等价、Ci 变体与 verify 检查；汇总核对四片同一候选与源码、形态无缺号无重复、对照片证明齐全。
  template-generation:
    name: 模板有效形态生成 · ${{ matrix.shard }}
    needs: quality-plan
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['template-generation']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ['0', '1', '2', 'control']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: 安装 YAML 解析依赖
        run: python -m pip install PyYAML==6.0.3
      - name: 生成本片并校验
        run: python scripts/test-template-generation.py --shard '${{ matrix.shard }}' --output .tmp/generation-proof
      # 模板包链路：打包、隔离安装、在仓库外生成两个代表场景，核对来源标记与按标记重建零差异（不发布）
      - name: 打包模板并验证来源标记与重建确定性
        if: matrix.shard == 'control'
        shell: pwsh
        run: pwsh template-package/test-template-package.ps1 -Version '0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}'
      - uses: actions/setup-node@v7
        if: fromJSON(needs.quality-plan.outputs.validation_plan).GeneratedDocumentation
        with:
          node-version: '24'
      - name: 核对全部生成文档与 Skill
        if: fromJSON(needs.quality-plan.outputs.validation_plan).GeneratedDocumentation
        run: python scripts/check-generated-documentation.py --generation-root .tmp/generation-proof
      - uses: actions/upload-artifact@v7
        if: fromJSON(needs.quality-plan.outputs.validation_plan).GeneratedDocumentation
        with:
          name: generated-documentation-proof-${{ matrix.shard }}
          path: .tmp/generation-proof/documentation-results.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: template-generation-proof-${{ matrix.shard }}
          path: .tmp/generation-proof/generation-results.json
          if-no-files-found: error

  template-matrix:
    name: 模板全场景矩阵
    runs-on: ubuntu-latest
    needs: [quality-plan, docs-sync, docs-sync-windows, frontend-gates, framework-pack, test, template-slices, template-generation, package-consumption, postgresql-e2e, oidc-e2e]
    if: always()
    timeout-minutes: 5
    outputs:
      validation_plan: ${{ steps.complete.outputs.validation_plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
      - name: 检查必要作业全部成功
        id: quality
        shell: pwsh
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          $jobs = ConvertFrom-Json $env:NEEDS_JSON -AsHashtable
          foreach ($required in @('quality-plan', 'docs-sync', 'docs-sync-windows')) {
            if ($jobs[$required].result -cne 'success') { throw "$required 失败、缺失、跳过或取消" }
          }
          New-Item -ItemType Directory -Force .tmp | Out-Null
          $jobs['quality-plan'].outputs.validation_plan | Set-Content .tmp/quality-plan.json -Encoding utf8
          . scripts/template-matrix-scenarios.ps1
          . scripts/quality-validation-plan.ps1
          $tier = (Get-Content .tmp/quality-plan.json -Raw | ConvertFrom-Json).Tier
          # 只有直接 PR 能收窄为 core；其余触发方式的计划必须是 full
          if ($env:PLAN_SCOPE -cne 'core' -and $tier -cne 'full') { throw '非直接 PR 的计划必须是 full 档' }
          $plan = Read-QualityValidationPlan .tmp/quality-plan.json $tier
          if ($plan.CandidateSha -cne $env:CANDIDATE_SHA) { throw '汇总候选身份不一致' }
          foreach ($responsibility in $plan.Jobs.PSObject.Properties) {
            $expected = if ($responsibility.Value) { 'success' } else { 'skipped' }
            if ($jobs[$responsibility.Name].result -cne $expected) { throw "$($responsibility.Name) 应为 $expected" }
          }
          "dynamic=$($plan.Jobs.'template-slices' ? 'true' : 'false')" | Out-File $env:GITHUB_OUTPUT -Append
          "framework_tests=$($plan.FrameworkTests ? 'true' : 'false')" | Out-File $env:GITHUB_OUTPUT -Append
          "tier=$tier" | Out-File $env:GITHUB_OUTPUT -Append
      # 直接 PR 的选择由汇总独立重算：同一 base/head 重新运行 planner，与执行的计划逐字段一致才放行。
      # 复用候选（release.yml）的计划已在 quality-plan 作业与调用方独立计算的预期计划比对过。
      - name: 独立重算 PR 选择
        if: github.event_name == 'pull_request' && !inputs.candidate_sha
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/plan-quality-checks.py --tier core --event pull_request --base "$PR_BASE_SHA" --expected-plan .tmp/quality-plan.json --output .tmp/recomputed-plan.json
      - uses: actions/download-artifact@v8
        if: steps.quality.outputs.dynamic == 'true'
        with:
          pattern: template-matrix-*
          path: .tmp/matrix-receipts
          merge-multiple: true
      - name: 核对预期场景、阶段和候选身份
        if: steps.quality.outputs.dynamic == 'true'
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.quality-plan.outputs.validation_plan }}
          CANDIDATE_VERSION: ${{ needs.framework-pack.outputs.candidate_version }}
        run: |
          $env:VALIDATION_PLAN | Set-Content .tmp/quality-plan.json -Encoding utf8
          pwsh scripts/check-template-matrix-results.ps1 -ResultsPath .tmp/matrix-receipts -ValidationPlanPath .tmp/quality-plan.json -Tier '${{ steps.quality.outputs.tier }}' -CandidateVersion $env:CANDIDATE_VERSION
          if ($LASTEXITCODE -ne 0) { throw '模板矩阵证明不完整' }
      - uses: actions/download-artifact@v8
        if: steps.quality.outputs.framework_tests == 'true'
        with:
          name: framework-test-receipts
          path: .tmp/framework-test-receipts
      # 回执与清单一一对应：缺一个、多一个、重复、失败或候选/基线不符都拒绝；
      # 全集计划另与候选里登记的全部测试项目比对，不能由清单自行缩小。
      - name: 核对框架测试回执
        id: framework_receipts
        if: steps.quality.outputs.framework_tests == 'true'
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.quality-plan.outputs.validation_plan }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          $plan = $env:VALIDATION_PLAN | ConvertFrom-Json
          $expected = @($plan.FrameworkTestProjects)
          if ($plan.FrameworkTestSelection -ceq 'all') {
            $registered = @(git ls-files -- 'framework/tests/*.Tests.csproj' | Sort-Object -CaseSensitive)
            if ($LASTEXITCODE -ne 0 -or $registered.Count -eq 0 -or
                (Compare-Object $registered @($expected | Sort-Object -CaseSensitive) -CaseSensitive -SyncWindow 0)) {
              throw '全集清单与候选登记的测试项目不一致'
            }
          }
          $seen = @{}
          foreach ($file in @(Get-ChildItem .tmp/framework-test-receipts -Filter *.json -File -ErrorAction SilentlyContinue)) {
            $receipt = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if ($receipt.Version -ne 1 -or $receipt.CandidateSha -cne $env:CANDIDATE_SHA -or $receipt.BaseSha -cne $plan.BaseSha -or
                $receipt.Result -cne 'pass' -or $receipt.Project -cnotin $expected -or $seen.ContainsKey($receipt.Project)) {
              throw "非法框架测试回执：$($file.Name)"
            }
            $seen[$receipt.Project] = $true
          }
          $missing = @($expected | Where-Object { -not $seen.ContainsKey($_) })
          if ($missing) { throw "选中的框架测试项目缺少回执：$($missing -join '、')" }
          "框架测试回执：$($expected.Count) 个项目全部通过。" | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/download-artifact@v8
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['package-consumption']
        with:
          name: package-content-proof
          path: .tmp/package-content-proof
      - name: 核对包与文档编译证明
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['package-consumption']
        shell: pwsh
        run: pwsh scripts/check-quality-proof.ps1 -ValidationPlanPath .tmp/quality-plan.json -Kind package -ResultsPath .tmp/package-content-proof
      - uses: actions/download-artifact@v8
        if: fromJSON(needs.quality-plan.outputs.validation_plan).GeneratedDocumentation
        with:
          pattern: generated-documentation-proof-*
          path: .tmp/generated-documentation-proof
      - name: 核对生成文档证明
        if: fromJSON(needs.quality-plan.outputs.validation_plan).GeneratedDocumentation
        shell: pwsh
        run: pwsh scripts/check-quality-proof.ps1 -ValidationPlanPath .tmp/quality-plan.json -Kind documentation -ResultsPath .tmp/generated-documentation-proof
      # 四片证明各自落在以 artifact 命名的子目录，不合并（同名文件会互相覆盖）
      - uses: actions/download-artifact@v8
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['template-generation']
        with:
          pattern: template-generation-proof-*
          path: .tmp/template-generation-proof
      - name: 核对模板生成证明
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['template-generation']
        shell: pwsh
        run: pwsh scripts/check-quality-proof.ps1 -ValidationPlanPath .tmp/quality-plan.json -Kind generation -ResultsPath .tmp/template-generation-proof
      - uses: actions/download-artifact@v8
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['postgresql-e2e']
        with:
          name: postgresql-e2e-proof
          path: .tmp/postgresql-e2e-proof
      - name: 核对 PostgreSQL 端到端证明
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['postgresql-e2e']
        shell: pwsh
        run: pwsh scripts/check-quality-proof.ps1 -ValidationPlanPath .tmp/quality-plan.json -Kind postgresql -ResultsPath .tmp/postgresql-e2e-proof
      - uses: actions/download-artifact@v8
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['oidc-e2e']
        with:
          name: oidc-e2e-proof
          path: .tmp/oidc-e2e-proof
      - name: 核对 OIDC 端到端证明
        if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['oidc-e2e']
        shell: pwsh
        run: pwsh scripts/check-quality-proof.ps1 -ValidationPlanPath .tmp/quality-plan.json -Kind oidc -ResultsPath .tmp/oidc-e2e-proof
      - name: 输出已验证候选计划
        id: complete
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.quality-plan.outputs.validation_plan }}
        run: '"validation_plan=$env:VALIDATION_PLAN" | Out-File $env:GITHUB_OUTPUT -Append'

  test:
    name: 框架单元测试
    needs: quality-plan
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs.test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 分布式锁的 Redis 契约用例需要真实服务：没有服务时它们会跳过而不是失败
    # （提交前自检必须在没装 Redis 的机器上也全绿），因此这里显式提供并在下面 ping 一次
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 恢复第三方 NuGet 下载缓存
        uses: actions/cache@v6
        with:
          path: ~/.local/share/NuGet/http-cache
          key: nuget-http-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-http-${{ runner.os }}-
      - name: 缓存中不保留 Leistd 包
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - name: 还原
        run: dotnet restore framework/Leistd.Framework.slnx
      # 不收集覆盖率：此前收集 23 份 cobertura 却没有任何下游步骤消费，
      # 产物直接丢弃，只留下"我们在度量覆盖率"的假信号。
      # 覆盖率定位为按需体检，命令见 framework/build/coverage.runsettings
      # 跳过是本地的让步，不是 CI 的。少了 Redis 服务时这一步直接红，
      # 而不是让锁的契约用例悄无声息地跳过去
      - name: 确认 Redis 可用
        run: |
          docker run --rm --network host redis:8-alpine \
            redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG
      # 清单来自同候选计划：受影响项目及其反向依赖闭包里的测试项目，无法证明时为全集。
      # 只有通过的项目写回执；汇总按清单逐项核对，漏跑或失败都缺回执。
      - name: 按清单测试
        id: framework_tests
        shell: pwsh
        env:
          VALIDATION_PLAN: ${{ needs.quality-plan.outputs.validation_plan }}
        run: |
          $plan = $env:VALIDATION_PLAN | ConvertFrom-Json
          $projects = @($plan.FrameworkTestProjects)
          if ($plan.CandidateSha -cne (git rev-parse HEAD) -or $projects.Count -eq 0) { throw '测试清单与当前候选不符或为空' }
          $receipts = '.tmp/framework-test-receipts'
          New-Item -ItemType Directory -Force $receipts | Out-Null
          $failed = @()
          foreach ($project in $projects) {
            dotnet test $project -c Release --no-restore
            if ($LASTEXITCODE -ne 0) { $failed += $project; continue }
            [ordered]@{ Version = 1; CandidateSha = $plan.CandidateSha; BaseSha = $plan.BaseSha; Project = $project; Result = 'pass' } |
              ConvertTo-Json -Compress | Set-Content (Join-Path $receipts ([IO.Path]::GetFileNameWithoutExtension($project) + '.json')) -Encoding utf8
          }
          "框架测试（$($plan.FrameworkTestSelection)，$($projects.Count) 个项目）：$($plan.FrameworkTestReason)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          if ($failed) { throw "框架测试失败：$($failed -join '、')" }
      - name: 保存前清除 Leistd 缓存条目
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - name: 保留逐项目回执
        uses: actions/upload-artifact@v7
        with:
          name: framework-test-receipts
          overwrite: true
          path: .tmp/framework-test-receipts/*.json
          if-no-files-found: error

  postgresql-e2e:
    name: 模板 PostgreSQL 端到端
    needs: [quality-plan, framework-pack]
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['postgresql-e2e']
    runs-on: ubuntu-latest
    # 复用候选包；各作业的数据库、hive 与解包缓存仍各自隔离。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # 矩阵的集成测试与冒烟各自只用一个库，验不到多库拆分、共享与专属租户库的物理隔离、
      # DbMigrator 命令行与跨进程密钥环这几类"不报错只给错结果"的失效。
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v8
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      - name: 恢复第三方 NuGet 下载缓存
        uses: actions/cache@v6
        with:
          path: ~/.local/share/NuGet/http-cache
          key: nuget-http-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-http-${{ runner.os }}-
      - name: 缓存中不保留 Leistd 包
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      # 脚本仍可独立运行并打包；CI 只读同候选包，容器与清理由脚本负责。
      - name: 生成 + 迁移 + 真实库隔离验证
        shell: pwsh
        run: pwsh scripts/test-template-postgresql-e2e.ps1 -SkipPack
      # 全部断言通过后才有证明；汇总核对其候选身份与断言数
      - name: 保存前清除 Leistd 缓存条目
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: postgresql-e2e-proof
          path: .tmp/postgresql-e2e/*/e2e-proof.json
          if-no-files-found: error

  oidc-e2e:
    name: 模板 OIDC 跨服务端到端
    needs: [quality-plan, framework-pack]
    if: fromJSON(needs.quality-plan.outputs.validation_plan).Jobs['oidc-e2e']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: 下载同一候选 Framework 包
        uses: actions/download-artifact@v8
        with:
          name: candidate-framework-feed
          path: .tmp/local-feed
      - name: 恢复第三方 NuGet 下载缓存
        uses: actions/cache@v6
        with:
          path: ~/.local/share/NuGet/http-cache
          key: nuget-http-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-http-${{ runner.os }}-
      - name: 缓存中不保留 Leistd 包
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      # 同候选包只读复用；四个真实 API、PostgreSQL、hive 与 finally 清理仍独立。
      # core 档不等令牌真实到期：S7 只验即时撤销与到期前窗口，交换令牌到期跳过。
      # full 档传 -IncludeExpiryWait，以快速档（访问令牌 90 秒）补跑两条真实到期边界。
      - name: 生成 + OIDC HTTP S2–S8 与 S10
        shell: pwsh
        env:
          PLAN_TIER: ${{ fromJSON(needs.quality-plan.outputs.validation_plan).Tier }}
        run: |
          $expiry = @(if ($env:PLAN_TIER -ceq 'full') { '-IncludeExpiryWait' })
          pwsh scripts/test-template-oidc-e2e.ps1 -SkipPack @expiry
      - name: 保存前清除 Leistd 缓存条目
        run: find ~/.local/share/NuGet/http-cache -iname '*leistd.*' -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        with:
          name: oidc-e2e-proof
          path: .tmp/oidc-e2e/*/e2e-proof.json
          if-no-files-found: error
      - name: 保留 OIDC 诊断证据
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oidc-e2e-logs
          # 只上传日志和脱敏断言，生成项目、密钥与 NuGet 缓存不上传。
          path: |
            .tmp/oidc-e2e/**/*.log
            .tmp/oidc-e2e/**/assertions.jsonl
            .tmp/oidc-e2e/**/results.json
            .tmp/oidc-e2e/**/topology.json
            .tmp/oidc-e2e/**/cleanup.json
