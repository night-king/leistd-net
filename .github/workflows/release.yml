name: Release

# 单一发布流水线：
#   push main    -> stable  : vX.Y.Z，发布 nuget.org + GitHub 正式 Release
#   push develop -> beta    : vX.Y.Z-beta.N，发布 nuget.org 预发布包 + GitHub prerelease
#   schedule     -> nightly : vX.Y.Z-preview.YYYYMMDD.RUN，发布 GitHub Packages + tag
# 发布原则：所有通道都打唯一 tag；stable Release Notes 从上一个 stable tag 累积所有 beta/nightly 期间变更。
on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 18 * * 1-5'   # UTC 18:00（北京次日 02:00），工作日 -> nightly
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    if: github.event_name != 'push' || (github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip ci]'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      needed: ${{ steps.plan.outputs.release_required }}
      plan: ${{ steps.plan.outputs.validation_plan }}
      release_base_tag: ${{ steps.plan.outputs.release_base_tag }}
      release_base_sha: ${{ steps.plan.outputs.release_base_sha }}
      channel: ${{ steps.commit.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.sha }}
          fetch-depth: 0
      - id: commit
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then channel=nightly
          elif [ "$GITHUB_REF" = refs/heads/main ]; then channel=stable
          else channel=beta; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - id: plan
        name: 判断质量与发布责任
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.before || '' }}
          CANDIDATE_SHA: ${{ steps.commit.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/plan-quality-checks.py --tier full --release-channel '${{ steps.commit.outputs.channel }}' --output .tmp/quality-plan.json --github-output

  quality:
    needs: candidate
    if: needs.candidate.result == 'success'
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}
      quality_base_sha: ${{ github.event.before || '' }}
      release_channel: ${{ needs.candidate.outputs.channel }}
      release_base_tag: ${{ needs.candidate.outputs.release_base_tag }}
      release_base_sha: ${{ needs.candidate.outputs.release_base_sha }}
      expected_plan: ${{ needs.candidate.outputs.plan }}

  release:
    needs: [candidate, quality]
    # 跳过机器人自身回写提交与 [skip ci]，避免死循环；schedule/dispatch 没有 head_commit。
    if: needs.candidate.outputs.needed == 'true' && needs.quality.result == 'success' && fromJSON(needs.quality.outputs.validation_plan).ReleaseRequired && fromJSON(needs.quality.outputs.validation_plan).Mode == 'full' && fromJSON(needs.quality.outputs.validation_plan).CandidateSha == needs.candidate.outputs.sha
    runs-on: ubuntu-latest
    # 同一分支的发布必须排队：版本推算是对 tag 命名空间的「读—改—写」，
    # stable 还要把版本回写 main。两个 run 并行时各自读到同一状态、算出同一个 tag，
    # 后落地的那个被 remote rejected（2026-09-11 两次合并撞出 v0.13.0-beta.148 即此）。
    # 按 ref 分组：stable / beta 各自排队，互不阻塞。
    #
    # cancel-in-progress: false —— 发布不能半途掐断（包已推 nuget，tag 未落）。
    # 代价是连续合并时中间那次可能在排队中被更新的 run 顶掉，那一版没有自己的 beta tag；
    # 它的内容会随下一版发出，可以接受。
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # 必须有上限：没有上限时挂死一次按默认 360 分钟计费
    timeout-minutes: 90
    permissions:
      contents: write      # 回写 VERSION / 打 tag / 建 Release
      id-token: write      # nuget.org Trusted Publishing（stable/beta）
      packages: write      # GitHub Packages（nightly）
    steps:
      - uses: actions/checkout@v4
        with:
          # nightly 固定构建 develop；其余构建**触发的那个提交**，不是分支当下的 tip。
          #
          # 写分支名会让"发了什么"取决于 checkout 那一刻分支在哪：两次合并挨得近时，
          # 两个 run 都检出同一个 tip，于是 beta 序号（按距上一个 stable tag 的提交数算）
          # 也一模一样，第二个 run 必然撞 tag。写 SHA 之后每个 run 各自对应一个提交，
          # 序号天然不同，tag 也就不会撞。
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 判定发布通道
        id: ch
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'schedule') {
            $channel = 'nightly'
          } elseif ('${{ github.ref }}' -eq 'refs/heads/main') {
            $channel = 'stable'
          } elseif ('${{ github.ref }}' -eq 'refs/heads/develop') {
            $channel = 'beta'
          } else {
            $channel = 'beta'
          }

          "channel=$channel" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "发布通道: $channel"

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 推算版本与 tag
        id: ver
        shell: pwsh
        run: |
          git fetch --tags --force

          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION 非法: $base" }

          $stableTags = @(git tag --merged HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } | Sort-Object { [version]($_ -replace '^v', '') })
          $lastStableTag = if ($stableTags.Count -gt 0) { $stableTags[-1] } else { '' }
          $range = if ([string]::IsNullOrWhiteSpace($lastStableTag)) { 'HEAD' } else { "$lastStableTag..HEAD" }
          $commitCount = [int](git rev-list --count $range)

          # 逐条解析，而不是把所有提交拼成一个文本 blob：
          # 「这一版有没有破坏性变更」可以看整体，但「每条带 ! 的提交有没有脚注」必须按条判。
          # 记录用 \x1e 分隔、字段用 \x00 分隔，正文里出现换行不会打乱切分。
          $raw = (git log $range --no-merges --pretty=format:'%H%x00%s%x00%b%x1e') -join "`n"
          $commits = @(
            $raw -split "`u{001e}" | Where-Object { $_.Trim() } | ForEach-Object {
              $parts = $_.TrimStart("`n") -split "`u{0000}"
              [pscustomobject]@{ Sha = $parts[0]; Subject = $parts[1]; Body = if ($parts.Count -gt 2) { $parts[2] } else { '' } }
            }
          )

          # 破坏性变更的两个判据，全流程共用这一处——升版与下面的脚注闸门用同一把尺，
          # 否则会出现「升版算成 major、闸门却说没有破坏性变更」这种自相矛盾。
          #
          # 脚注必须是 Conventional Commits 的真脚注（行首 BREAKING CHANGE: / BREAKING-CHANGE:），
          # 不是正文里任意位置出现这串字样。此前用的 (?im)(BREAKING CHANGE) 没有锚点：
          # 一条只在正文里提到「这次不算 BREAKING CHANGE」的 docs 提交也会被判成 major。
          #
          # 脚注要求：行首、大写、冒号后同一行就有内容。三处识别（闸门、升版、发布说明）必须一致，
          # 只在一处接受连字符会出现"过了闸门却不进发布说明"。
          #
          # (?-i) 是必须的：PowerShell 的 -match 默认不区分大小写，不关掉的话正文里一行
          # `breaking change: none` 就会把这一版判成 major。规范规定脚注是大写。
          # [ \t]* 而不是 \s*：\s 本身就包含换行（与 s 模式无关，s 管的是点号），所以 \s* 会跨行——
          # `BREAKING CHANGE:` 独占一行、空行之后随便一段正文也会被算成"脚注非空"，
          # 那等于没有非空检查。
          # 标题里的 type 仍不区分大小写：`FEAT!:` 也要求脚注，宽进严出，漏判才是问题。
          function Test-BreakingMark([string]$Subject) { $Subject -match '^[a-z]+(\([^)]*\))?!:' }
          function Test-BreakingFooter([string]$Body) { $Body -match '(?m-i)^BREAKING[ -]CHANGE:[ \t]*\S' }

          # 带 ! 的提交必须有脚注：适配方是靠 git log --grep='BREAKING CHANGE' 检索改动的，
          # 只有 ! 的提交不在那个结果里，对应的改动会被整体漏掉（versioning.md 第 57 节起）。
          #
          # 脚注检查从固定锚点开始，不扩大历史豁免；升版推算仍使用完整提交范围。
          $footnoteAnchor = '802b4dca012bda2e6d64f4a7939860bf950cd302'
          git merge-base --is-ancestor $footnoteAnchor HEAD 2>$null
          if ($LASTEXITCODE -ne 0) {
            throw ("脚注闸门的起点 $footnoteAnchor 不在当前历史里。若这是有意的分支重构，" +
              "请把 `$footnoteAnchor 更新成新历史里「闸门开始生效」的那个提交，并在 docs/framework/versioning.md 写明原因。")
          }
          $footnoteScope = [System.Collections.Generic.HashSet[string]]::new(
            [string[]]@(git rev-list "$footnoteAnchor..HEAD"), [StringComparer]::Ordinal)

          $missingFooter = @($commits | Where-Object {
            $footnoteScope.Contains($_.Sha) -and (Test-BreakingMark $_.Subject) -and -not (Test-BreakingFooter $_.Body)
          })
          if ($missingFooter.Count -gt 0) {
            $listed = ($missingFooter | ForEach-Object { "  $($_.Sha.Substring(0,8)) $($_.Subject)" }) -join "`n"
            throw ("这些提交标了 ! 但没有 BREAKING CHANGE: 脚注，适配方按脚注检索时会漏掉：`n$listed`n" +
              "脚注不必复述细节，指向升级说明的具体小节即可（见 docs/framework/versioning.md）。")
          }

          $hasBreaking = @($commits | Where-Object { (Test-BreakingMark $_.Subject) -or (Test-BreakingFooter $_.Body) }).Count -gt 0
          $hasFeat = @($commits | Where-Object { $_.Subject -match '^feat(\([^)]*\))?:' }).Count -gt 0

          $p = $base.Split('.')
          [int]$maj = $p[0]
          [int]$min = $p[1]
          [int]$pat = $p[2]

          $bump = 'patch'
          if ($hasBreaking) { $bump = 'major' }
          elseif ($hasFeat) { $bump = 'minor' }

          # SemVer 第 4 条：0.y.z 是初始开发期，公共 API 不承诺稳定，
          # 因此该期间的破坏性变更按 minor 递增，不进 1.0.0。
          # 进 1.0.0 必须是一次显式决定（手动抬 VERSION），不能由任意一条带 ! 的
          # 提交顺带触发——否则「第一次不兼容改动」就成了发布 1.0 的时间点。
          # 破坏性变更本身不会被吞掉：release notes 仍按 ! / BREAKING CHANGE 归入
          # 「破坏性变更」小节，消费者照样看得到。
          if ($bump -eq 'major' -and $maj -eq 0) { $bump = 'minor' }

          switch ($bump) {
            'major' { $maj++; $min = 0; $pat = 0 }
            'minor' { $min++; $pat = 0 }
            default { $pat++ }
          }

          $baseVersion = "$maj.$min.$pat"
          $preNumber = [Math]::Max($commitCount, 1)
          switch ('${{ steps.ch.outputs.channel }}') {
            'beta' {
              $version = "$baseVersion-beta.$preNumber"
            }
            'nightly' {
              # NuGet SemVer2 兼容：日期与 run_number 都是不带前导 0 的数字标识符。
              $version = "$baseVersion-preview.$(Get-Date -Format 'yyyyMMdd').${{ github.run_number }}"
            }
            default {
              $version = $baseVersion
            }
          }

          $tag = "v$version"
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Append
          "baseVersion=$baseVersion" | Out-File $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File $env:GITHUB_OUTPUT -Append
          "lastStableTag=$lastStableTag" | Out-File $env:GITHUB_OUTPUT -Append
          "bump=$bump" | Out-File $env:GITHUB_OUTPUT -Append
          "commitCount=$commitCount" | Out-File $env:GITHUB_OUTPUT -Append

          Write-Host "通道=${{ steps.ch.outputs.channel }} bump=$bump version=$version tag=$tag lastStable=$lastStableTag"

      - name: 检查 tag 是否已存在
        shell: pwsh
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          # git rev-parse 在 tag 不存在时退出码为 1，会污染 $LASTEXITCODE，
          # 导致 GitHub Actions 误判步骤失败。用 git tag -l 判定是否存在，并显式吞掉退出码。
          $exists = (git tag -l $tag) -ne $null -and (git tag -l $tag) -ne ''
          if ($exists) {
            throw "tag 已存在: $tag。请检查是否重复运行同一发布。"
          }
          $global:LASTEXITCODE = 0

      # 发布说明固定到本次 tag；有可选指南时链接指南，否则链接对应 Release 或 nightly 提交页。
      - name: 确定升级指南与包发布说明链接
        id: links
        shell: pwsh
        run: |
          $repoUrl = 'https://github.com/${{ github.repository }}'
          $tag = '${{ steps.ver.outputs.tag }}'
          $channel = '${{ steps.ch.outputs.channel }}'
          $guide = 'docs/framework/upgrades/${{ steps.ver.outputs.baseVersion }}.md'
          $guideUrl = if (Test-Path -LiteralPath $guide -PathType Leaf) { "$repoUrl/blob/$tag/$guide" } else { '' }
          if ($channel -notin 'stable', 'beta', 'nightly') { throw "未知发布通道: $channel" }
          $packageReleaseNotes = if ($guideUrl) { $guideUrl }
            elseif ($channel -eq 'nightly') { "$repoUrl/commit/$tag" }
            else { "$repoUrl/releases/tag/$tag" }
          "guideUrl=$guideUrl" | Out-File $env:GITHUB_OUTPUT -Append
          "packageReleaseNotes=$packageReleaseNotes" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "升级指南: $(if ($guideUrl) { $guideUrl } else { '无' })；PackageReleaseNotes: $packageReleaseNotes"

      - name: 生成发布说明
        id: notes
        shell: pwsh
        run: |
          $lastStableTag = '${{ steps.ver.outputs.lastStableTag }}'
          $range = if ([string]::IsNullOrWhiteSpace($lastStableTag)) { 'HEAD' } else { "$lastStableTag..HEAD" }
          $raw = (git log $range --format='%s%x1f%b%x1e' --no-merges) -join "`n"
          $commits = @($raw -split [string][char]0x1e | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | ForEach-Object {
            # 分类用的标题与正文保持原样，不 Trim：上一步的脚注闸门判的是未经处理的正文，
            # 这里先去掉缩进的话，`  BREAKING CHANGE: x` 会被闸门判成缺脚注、却在这里成为脚注。
            # 展示时再整理（见下面的 .Trim()）。
            $parts = $_.Trim() -split [string][char]0x1f, 2
            [pscustomobject]@{ Subject = $parts[0]; Body = if ($parts.Count -gt 1) { $parts[1] } else { '' } }
          })

          $breaking = New-Object System.Collections.Generic.List[string]
          $features = New-Object System.Collections.Generic.List[string]
          $fixes = New-Object System.Collections.Generic.List[string]
          $others = New-Object System.Collections.Generic.List[string]

          foreach ($commit in $commits) {
            $subject = $commit.Subject
            $body = $commit.Body
            if ([string]::IsNullOrWhiteSpace($subject)) { continue }
            if ($subject -match '(?i)bump version|发布 v|chore:.*version') { continue }
            # 与上一步的 Test-BreakingFooter 同一口径：行首、大写（(?-i)）、两种写法等价。
            # 只认其中一种或漏掉 (?-i)，会出现"过了脚注闸门却不进发布说明"或反之。
            # (\S.*?) 而不是 (.+?)：冒号后必须同一行就有内容，否则"空脚注 + 空行 + 无关正文"
            # 会被闸门判成无脚注、却被这里提取出正文，两处判定相反。续行仍然收得进来（s 模式）。
            #
            # 结束条件除了空行与正文末尾，还要算上"下一个脚注"：规范允许后一个脚注终止前一个的值，
            # 中间不必空行。不算的话 `BREAKING CHANGE: 见升级说明` 紧跟 `Reviewed-by: X`
            # 会把签名行一起并进破坏性说明里。脚注分隔符按规范是 ": " 或 " #"。
            # BREAKING CHANGE 要单列：规范只给它开了带空格的例外，按 [A-Za-z-]+ 匹配 token
            # 会漏掉它，于是紧邻的第二条 BREAKING CHANGE 被并进第一条。
            $breakingDetail = if ($body -match '(?ms-i)^BREAKING[ -]CHANGE:[ \t]*(\S.*?)(?=\r?\n\r?\n|\r?\nBREAKING[ -]CHANGE:|\r?\n[A-Za-z][A-Za-z-]*(?:: | #)|\z)') {
              ($Matches[1].Trim() -replace '\s*\r?\n\s*', ' ')
            } else { '' }

            $display = $subject.Trim()
            if ($breakingDetail -or $subject -match '^[a-z]+(\([^)]*\))?!:') {
              $breaking.Add("- $display" + $(if ($breakingDetail) { " — $breakingDetail" } else { '' }))
            } elseif ($subject -match '^feat(\([^)]*\))?:\s*(.+)$') {
              $features.Add("- $($Matches[2])")
            } elseif ($subject -match '^fix(\([^)]*\))?:\s*(.+)$') {
              $fixes.Add("- $($Matches[2])")
            } else {
              $others.Add("- $subject")
            }
          }

          $preTags = @()
          if (-not [string]::IsNullOrWhiteSpace($lastStableTag)) {
            $preTags = @(git tag --merged HEAD | Where-Object { $_ -match '^v\d+\.\d+\.\d+-(beta|alpha|rc|preview|nightly)\.' } | ForEach-Object {
              $tag = $_
              $sha = git rev-list -n 1 $tag
              git merge-base --is-ancestor $lastStableTag $sha
              if ($LASTEXITCODE -eq 0) { $tag }
            } | Sort-Object)
          }

          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('## NuGet')
          $lines.Add('')
          $lines.Add('```bash')
          $lines.Add("dotnet add package Leistd.Core --version ${{ steps.ver.outputs.version }}")
          $lines.Add('```')
          $lines.Add('')
          $lines.Add('## 变更范围')
          $lines.Add('')
          if ([string]::IsNullOrWhiteSpace($lastStableTag)) {
            $lines.Add('- 首个稳定版本，包含当前历史中的所有提交。')
          } else {
            $lines.Add("- $lastStableTag..${{ steps.ver.outputs.tag }}")
          }
          $lines.Add('')

          if ($breaking.Count -gt 0) { $lines.Add('## Breaking Changes'); $lines.Add(''); $breaking | ForEach-Object { $lines.Add($_) }; $lines.Add('') }
          if ($features.Count -gt 0) { $lines.Add('## 新功能'); $lines.Add(''); $features | ForEach-Object { $lines.Add($_) }; $lines.Add('') }
          if ($fixes.Count -gt 0) { $lines.Add('## 修复'); $lines.Add(''); $fixes | ForEach-Object { $lines.Add($_) }; $lines.Add('') }
          if ($others.Count -gt 0) { $lines.Add('## 其他更新'); $lines.Add(''); $others | ForEach-Object { $lines.Add($_) }; $lines.Add('') }
          if ($breaking.Count + $features.Count + $fixes.Count + $others.Count -eq 0) { $lines.Add('## 更新内容'); $lines.Add(''); $lines.Add('- 代码优化和维护更新。'); $lines.Add('') }

          $guideUrl = '${{ steps.links.outputs.guideUrl }}'
          if ($guideUrl) {
            $lines.Add('## 升级指南')
            $lines.Add('')
            $lines.Add("- [从上一版本升级到 ${{ steps.ver.outputs.baseVersion }}]($guideUrl)")
            $lines.Add('')
          }

          if ($preTags.Count -gt 0 -and '${{ steps.ch.outputs.channel }}' -eq 'stable') {
            $lines.Add('## 已验证的预发布版本')
            $lines.Add('')
            $preTags | ForEach-Object { $lines.Add("- $_") }
            $lines.Add('')
          }

          $content = $lines -join "`n"
          "content<<EOF" | Out-File $env:GITHUB_OUTPUT -Append
          $content | Out-File $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File $env:GITHUB_OUTPUT -Append

      - name: 准备 stable 版本提交
        if: steps.ch.outputs.channel == 'stable'
        shell: pwsh
        run: |
          Set-Content -NoNewline -Path VERSION -Value '${{ steps.ver.outputs.version }}'
          $f = 'template/backend/Directory.Build.props'
          $t = Get-Content $f -Raw
          $t = [regex]::Replace($t, '<LeistdFrameworkVersion>\s*[^<]*?\s*</LeistdFrameworkVersion>', '<LeistdFrameworkVersion>${{ steps.ver.outputs.version }}</LeistdFrameworkVersion>')
          [System.IO.File]::WriteAllText((Resolve-Path $f), $t)

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSION template/backend/Directory.Build.props
          # git diff --cached --quiet 无 stdout，PowerShell 的 if 只看输出真伪会误判；
          # 应按退出码判定：0=无暂存变更，非 0=有变更。再显式归零 $LASTEXITCODE 防污染。
          git diff --cached --quiet
          $hasChanges = $LASTEXITCODE -ne 0
          $global:LASTEXITCODE = 0
          if ($hasChanges) {
            git commit -m 'chore: 发布 ${{ steps.ver.outputs.tag }} [skip ci]'
          } else {
            Write-Host '没有需要回写的版本文件变更。'
          }

      # tag 只在这里创建一次，后面的推送与失败恢复都用这同一个 tag 对象（随原产物保存为 bundle）。
      # stable 指向上一步的版本回写提交（无回写变更时即候选 SHA），beta/nightly 指向候选 SHA。
      - name: 创建发布 tag（仅本地）
        id: tag
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ steps.ver.outputs.tag }}' -m 'Release ${{ steps.ver.outputs.tag }}'
          if ($LASTEXITCODE -ne 0) { throw '创建本地 tag 失败' }
          $sha = git rev-parse '${{ steps.ver.outputs.tag }}^{commit}'
          "release_sha=$sha" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "发布 SHA: $sha"

      - name: 打包
        id: pack
        shell: pwsh
        env:
          PACKAGE_RELEASE_NOTES: ${{ steps.links.outputs.packageReleaseNotes }}
        run: |
          if (-not $env:PACKAGE_RELEASE_NOTES) { throw '缺少 PackageReleaseNotes 链接' }
          if (Test-Path framework/artifacts) { Remove-Item -Recurse -Force framework/artifacts }
          dotnet pack framework/Leistd.Framework.slnx -c Release `
            -o framework/artifacts `
            -p:Version="${{ steps.ver.outputs.version }}" `
            -p:PackageVersion="${{ steps.ver.outputs.version }}" `
            -p:PackageReleaseNotes="$env:PACKAGE_RELEASE_NOTES" `
            -p:ContinuousIntegrationBuild=true
          if ($LASTEXITCODE -ne 0) { throw 'dotnet pack 失败' }

      - name: 检查最终版本的包内容与隔离消费
        shell: pwsh
        run: pwsh framework/build/test-package-consumption.ps1 -FeedPath framework/artifacts

      - name: 用最终 stable 版本生成并构建项目
        if: steps.ch.outputs.channel == 'stable'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tmp/release-feed -Force | Out-Null
          Copy-Item framework/artifacts/*.nupkg .tmp/release-feed/
          pwsh scripts/test-template-matrix.ps1 -Scenarios standalone -SkipPack `
            -LocalFeedPath .tmp/release-feed -SkipFrontend -SkipRuntime
          if ($LASTEXITCODE -ne 0) { throw '最终 stable 版本的模板生成验证失败' }

      # 推包前保存最终产物：推包或之后任一步失败时，恢复只能用这批原 nupkg 与原 tag，
      # 不能从包源取回未上传的包，也不能从分支重新打包（见 versioning.md「部分发布恢复」）。
      - name: 整理最终发布产物
        id: release-files
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.content }}
        run: |
          # runner 临时目录而非 .tmp：upload-artifact v4 默认排除以点开头的隐藏路径
          $out = Join-Path $env:RUNNER_TEMP 'release-artifact'
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          New-Item -ItemType Directory -Path "$out/packages" -Force | Out-Null
          $version = '${{ steps.ver.outputs.version }}'
          $packages = @(Get-ChildItem framework/artifacts -Filter '*.nupkg' | Sort-Object Name)
          if ($packages.Count -eq 0) { throw 'framework/artifacts 下没有 nupkg' }
          $foreign = @($packages | Where-Object { -not $_.Name.EndsWith(".$version.nupkg") })
          if ($foreign) { throw "包版本与 $version 不符：$($foreign.Name -join ', ')" }
          $packages | Copy-Item -Destination "$out/packages/"
          $manifest = [ordered]@{
            channel = '${{ steps.ch.outputs.channel }}'
            version = $version
            tag = '${{ steps.ver.outputs.tag }}'
            releaseSha = '${{ steps.tag.outputs.release_sha }}'
            candidateSha = '${{ needs.candidate.outputs.sha }}'
            runId = '${{ github.run_id }}'
            packages = @($packages | ForEach-Object {
              [ordered]@{ id = $_.Name.Substring(0, $_.Name.Length - ".$version.nupkg".Length); file = $_.Name; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            })
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content "$out/manifest.json" -Encoding utf8
          $env:RELEASE_NOTES | Set-Content "$out/release-notes.md" -Encoding utf8
          # tag 对象及 stable 版本提交只在 runner 本地，bundle 让恢复时推送的是同一对象
          git bundle create "$out/release.bundle" 'refs/tags/${{ steps.ver.outputs.tag }}' --not '${{ needs.candidate.outputs.sha }}'
          if ($LASTEXITCODE -ne 0) { throw '生成 tag bundle 失败' }
          Write-Host "已整理 $($packages.Count) 个包，发布 SHA ${{ steps.tag.outputs.release_sha }}"

      - name: 上传最终发布产物
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error

      - name: 登录 nuget.org
        if: steps.ch.outputs.channel != 'nightly'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 推送到 nuget.org
        id: push-nuget
        if: steps.ch.outputs.channel != 'nightly'
        run: >
          dotnet nuget push "framework/artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"

      - name: 推送到 GitHub Packages（nightly）
        id: push-gpr
        if: steps.ch.outputs.channel == 'nightly'
        run: >
          dotnet nuget push "framework/artifacts/*.nupkg"
          --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}

      # 包源写入后立即固定版本身份；索引延迟不能阻止 tag 记录已发布产物。
      # 只重试推送，不重建 tag；每次推送前查远端，同名 tag 已指向发布 SHA 即完成，指向其他提交即停止。
      - name: 推送 tag
        id: push-tag
        shell: pwsh
        run: pwsh scripts/push-release-ref.ps1 -Kind tag -Name '${{ steps.ver.outputs.tag }}' -ExpectedSha '${{ steps.tag.outputs.release_sha }}'

      # stable 的版本回写提交单独推：tag 已落地后，main 只允许从候选 SHA 快进到发布 SHA。
      - name: 推送 stable 版本回写提交
        id: push-main
        if: steps.ch.outputs.channel == 'stable'
        shell: pwsh
        run: pwsh scripts/push-release-ref.ps1 -Kind branch -Name main -ExpectedSha '${{ steps.tag.outputs.release_sha }}' -BaseSha '${{ needs.candidate.outputs.sha }}'

      # action 自带创建重试与按 tag 查找已有 Release，这里不再叠加重试；失败时由下一步给出补齐指引。
      - name: 创建 GitHub Release（stable / beta）
        id: gh-release
        if: steps.ch.outputs.channel != 'nightly'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ch.outputs.channel == 'stable' && 'Release' || 'Prerelease' }} ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.content }}
          files: framework/artifacts/*.nupkg
          prerelease: ${{ steps.ch.outputs.channel != 'stable' }}
          make_latest: ${{ steps.ch.outputs.channel == 'stable' }}

      # 只按步骤 outcome 与推送脚本的 result 判定到达的阶段，不解析日志文字。
      - name: 写出恢复指引
        if: failure() || cancelled()
        shell: pwsh
        env:
          CHANNEL: ${{ steps.ch.outputs.channel }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          RELEASE_SHA: ${{ steps.tag.outputs.release_sha }}
          ARTIFACT_NAME: release-packages-${{ steps.ver.outputs.version }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          PUSH_OUTCOME: ${{ steps.ch.outputs.channel == 'nightly' && steps.push-gpr.outcome || steps.push-nuget.outcome }}
          TAG_OUTCOME: ${{ steps.push-tag.outcome }}
          TAG_RESULT: ${{ steps.push-tag.outputs.result }}
          BRANCH_OUTCOME: ${{ steps.push-main.outcome }}
          BRANCH_RESULT: ${{ steps.push-main.outputs.result }}
          RELEASE_OUTCOME: ${{ steps.gh-release.outcome }}
        # 同一会话内调用：空的 outcome/result 作为空字符串绑定参数，交给子进程会被当作缺省实参丢掉
        run: >
          & ./scripts/write-release-recovery-summary.ps1
          -Channel $env:CHANNEL -Version $env:VERSION -Tag $env:TAG
          -CandidateSha $env:CANDIDATE_SHA -ReleaseSha $env:RELEASE_SHA
          -Repository '${{ github.repository }}' -ServerUrl '${{ github.server_url }}' -RunId '${{ github.run_id }}'
          -ArtifactName $env:ARTIFACT_NAME -ArtifactOutcome $env:ARTIFACT_OUTCOME
          -PushOutcome $env:PUSH_OUTCOME -TagOutcome $env:TAG_OUTCOME -TagResult $env:TAG_RESULT
          -BranchOutcome $env:BRANCH_OUTCOME -BranchResult $env:BRANCH_RESULT -ReleaseOutcome $env:RELEASE_OUTCOME
