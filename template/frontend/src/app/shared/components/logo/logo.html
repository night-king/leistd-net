<div
  [ngClass]="{
    'size-8': size() === 'normal',
    'size-14': size() === 'large',
  }"
  class="bg-primary text-primary-foreground flex shrink-0 items-center justify-center rounded-md"
>
  <svg
    [ngClass]="{
      'size-6': size() === 'normal',
      'size-10': size() === 'large',
    }"
    viewBox="0 0 100 100"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <text
      x="50"
      y="72"
      font-size="60"
      font-weight="600"
      fill="currentColor"
      text-anchor="middle"
      font-family="Geist, system-ui, sans-serif"
    >
      T
    </text>
  </svg>
</div>
