<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="grid grid-cols-4 gap-1" aria-hidden="true">
    @for (segment of segments; track segment) {
      <span
        class="h-1 rounded-full"
        [class]="segment > state().filled ? 'bg-muted' : state().met ? 'bg-success' : 'bg-warning'"
      ></span>
    }
  </div>
  <!-- 不设 live region：组件是输入框的描述，读屏在聚焦或查询描述时读到；逐字播报会与输入的回显叠在一起 -->
  <p class="sr-only">
    @if (state().met) {
      {{ t('common.passwordLength.met') }}
    } @else {
      {{ t('common.passwordLength.progress', { min: min, remaining: state().remaining }) }}
    }
  </p>
</ng-container>
