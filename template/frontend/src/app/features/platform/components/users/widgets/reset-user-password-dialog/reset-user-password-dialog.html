<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <hlm-dialog
    [state]="visible() ? 'open' : 'closed'"
    (stateChanged)="onDialogStateChange($event)"
    [closeOnOutsidePointerEvents]="!saving()"
  >
    <hlm-dialog-content
      *hlmDialogPortal
      class="flex max-h-[calc(100dvh-2rem)] flex-col overflow-hidden sm:max-w-md"
      [showCloseButton]="!saving()"
    >
      <hlm-dialog-header>
        <h2 hlmDialogTitle>{{ t('users.resetDialog.header') }}</h2>
      </hlm-dialog-header>

      <form
        novalidate
        (submit)="$event.preventDefault(); save()"
        class="flex min-h-0 flex-1 flex-col gap-4"
      >
        <div class="flex min-h-0 flex-1 flex-col gap-4 overflow-y-auto -mx-4 -my-1 px-4 py-1">
          <div
            class="rounded-md border border-warning/30 bg-warning/10 px-3 py-2 text-sm text-warning"
          >
            {{ t('users.resetDialog.warning') }}
          </div>

          <div hlmField>
            <label hlmFieldLabel for="reset-password">{{
              t('users.resetDialog.newPasswordLabel')
            }}</label>
            <hlm-input-group>
              <input
                hlmInputGroupInput
                id="reset-password"
                autocomplete="new-password"
                [type]="showPassword() ? 'text' : 'password'"
                [formField]="resetForm.password"
                [placeholder]="t('users.resetDialog.newPasswordPlaceholder')"
              />
              <button
                hlmInputGroupButton
                type="button"
                size="icon-sm"
                align="inline-end"
                [attr.aria-label]="
                  showPassword() ? t('common.hidePassword') : t('common.showPassword')
                "
                (click)="showPassword.set(!showPassword())"
              >
                <ng-icon [name]="showPassword() ? 'lucideEyeOff' : 'lucideEye'" />
              </button>
            </hlm-input-group>
            <app-password-length-meter [password]="resetForm.password().value()" />
            @for (error of resetForm.password().errors(); track error.kind) {
              <hlm-field-error [validator]="error.kind">{{
                t('validation.' + error.kind, error)
              }}</hlm-field-error>
            }
          </div>
        </div>
        <hlm-dialog-footer>
          <button hlmBtn type="button" variant="ghost" (click)="onHide()">
            {{ t('common.cancel') }}
          </button>
          <button hlmBtn type="submit" [disabled]="saving()">
            @if (saving()) {
              <hlm-spinner class="text-base" data-icon="inline-start" />
            }
            {{ t('users.resetDialog.confirmButton') }}
          </button>
        </hlm-dialog-footer>
      </form>
    </hlm-dialog-content>
  </hlm-dialog>
</ng-container>
