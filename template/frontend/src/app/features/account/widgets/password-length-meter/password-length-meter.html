<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="grid grid-cols-4 gap-1" aria-hidden="true">
    @for (segment of segments; track segment) {
      <span
        class="h-1 rounded-full"
        [class]="segment > state().filled ? 'bg-muted' : state().met ? 'bg-success' : 'bg-warning'"
      ></span>
    }
  </div>
  <p hlmFieldDescription class="text-xs" aria-live="polite">
    @if (state().met) {
      {{ t('account.passwordLength.met') }}
    } @else {
      {{ t('account.passwordLength.progress', { min: min, remaining: state().remaining }) }}
    }
  </p>
</ng-container>
