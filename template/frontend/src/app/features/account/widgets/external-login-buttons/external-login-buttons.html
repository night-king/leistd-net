<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <!-- 外部登录放在表单下方、左右并排，分隔线在上：入口按已配置的提供商渲染；加载失败单独提示，不当作"未配置"。 -->
  @if (loadFailed()) {
    <div class="flex flex-col gap-1">
      <p class="flex items-center gap-2 text-sm text-muted-foreground">
        {{ t('account.login.externalProvidersLoadFailed') }}
        <button
          hlmBtn
          type="button"
          variant="link"
          size="sm"
          class="px-0"
          data-testid="external-login-retry"
          (click)="loadProviders()"
        >
          {{ t('common.retry') }}
        </button>
      </p>
      @if (trace(); as trace) {
        <p class="text-xs text-muted-foreground" data-testid="external-login-trace">
          {{ trace }}
        </p>
      }
    </div>
  } @else if (hasRenderable()) {
    <div class="flex items-center gap-3" data-testid="external-divider">
      <div class="flex-1 border-t"></div>
      <span class="text-muted-foreground text-xs">{{ dividerLabel() }}</span>
      <div class="flex-1 border-t"></div>
    </div>

    <div class="flex gap-3">
      @if (has('github')) {
        <button
          hlmBtn
          type="button"
          variant="outline"
          class="flex-1"
          data-testid="external-login-github"
          [disabled]="blocked() || redirecting()"
          (click)="start('github', 'GitHub')"
        >
          <ng-icon name="github" data-icon="inline-start" />
          GitHub
        </button>
      }

      @if (has('google')) {
        <button
          hlmBtn
          type="button"
          variant="outline"
          class="flex-1"
          data-testid="external-login-google"
          [disabled]="blocked() || redirecting()"
          (click)="start('google', 'Google')"
        >
          <svg
            class="size-4"
            data-icon="inline-start"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="#4285F4"
            />
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="#34A853"
            />
            <path
              d="M5.84 14.11c-.22-.66-.35-1.36-.35-2.11s.13-1.45.35-2.11V7.05H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.95l3.66-2.84z"
              fill="#FBBC05"
            />
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.05l3.66 2.84c.87-2.6 3.3-4.51 6.16-4.51z"
              fill="#EA4335"
            />
          </svg>
          Google
        </button>
      }
    </div>
  }
</ng-container>
