<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="flex flex-col gap-6" data-testid="two-factor-challenge">
    <div class="flex flex-col gap-2">
      <h1 class="flex items-center gap-2 text-2xl font-semibold tracking-tight">
        <ng-icon name="lucideShieldCheck" class="text-primary" />
        {{ t('account.twoFactorLogin.title') }}
      </h1>
      <p class="text-muted-foreground text-sm">
        {{
          useRecoveryCode()
            ? t('account.twoFactorLogin.recoveryHint')
            : t('account.twoFactorLogin.codeHint')
        }}
      </p>
    </div>

    <form class="flex flex-col gap-4" novalidate (submit)="$event.preventDefault(); submit()">
      @if (useRecoveryCode()) {
        <input
          hlmInput
          class="font-mono"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          maxlength="64"
          data-testid="two-factor-recovery-input"
          [attr.aria-label]="t('account.twoFactorLogin.recoveryLabel')"
          [placeholder]="t('account.twoFactorLogin.recoveryLabel')"
          [value]="value()"
          (input)="onInput($event)"
        />
      } @else {
        <app-otp-code-input
          inputId="two-factor-code"
          data-testid="two-factor-code-input"
          [label]="t('account.twoFactorLogin.codeLabel')"
          [autofocus]="true"
          [(value)]="value"
          (completed)="submit()"
        />
      }
      <button
        hlmBtn
        type="submit"
        class="w-full"
        data-testid="two-factor-submit"
        [disabled]="!canSubmit()"
      >
        @if (submitting()) {
          <hlm-spinner class="text-base" data-icon="inline-start" />
        }
        {{ t('account.twoFactorLogin.submit') }}
      </button>
    </form>

    <div class="flex flex-col items-start gap-2 text-sm">
      <button hlmBtn variant="link" size="sm" class="px-0" type="button" (click)="toggleMode()">
        {{
          useRecoveryCode()
            ? t('account.twoFactorLogin.useCode')
            : t('account.twoFactorLogin.useRecovery')
        }}
      </button>
      <button
        hlmBtn
        variant="link"
        size="sm"
        class="text-muted-foreground px-0"
        type="button"
        (click)="cancelled.emit()"
      >
        <ng-icon name="lucideArrowLeft" data-icon="inline-start" />
        {{ t('account.twoFactorLogin.back') }}
      </button>
    </div>
  </div>
</ng-container>
