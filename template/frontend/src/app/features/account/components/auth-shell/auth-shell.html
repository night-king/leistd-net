<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <div class="bg-background grid min-h-svh lg:grid-cols-2">
    <!-- 左栏是独立的品牌面板，贴边铺满半屏；窄屏不显示，表单独占一屏，品牌标识改由表单栏顶部给出 -->
    <aside
      class="bg-muted relative hidden flex-col gap-10 overflow-hidden px-10 pt-6 pb-10 lg:flex"
      [attr.aria-label]="t('account.brand.title')"
    >
      <div
        aria-hidden="true"
        class="bg-primary/15 pointer-events-none absolute -start-24 -top-24 size-96 rounded-full blur-3xl"
      ></div>
      <!-- 与右栏主题、语言切换同高，两栏顶部一条线 -->
      <a
        routerLink="/"
        class="relative flex h-9 items-center gap-2 self-start text-sm font-semibold"
      >
        <app-logo />
        {{ t('account.brand.title') }}
      </a>
      <!-- 中文标题只在标点和空格处换行，不在词中间断开 -->
      <div class="relative flex max-w-xl flex-col gap-3">
        <p class="text-3xl font-semibold tracking-tight text-balance break-keep wrap-anywhere">
          {{ t('account.brand.headline') }}
        </p>
        <p class="text-muted-foreground text-sm">{{ t('account.brand.subtitle') }}</p>
      </div>
      <!-- 产品截图与着陆页同一组图：亮暗各一张，跟随当前主题；向表单一侧出血，被分栏边界截断 -->
      <div
        class="relative -me-24 mt-auto rounded-xl bg-background/60 p-1.5 shadow-lg ring-1 ring-foreground/10"
      >
        <img
          class="block w-full rounded-lg dark:hidden"
          src="images/product-dashboard-light.webp"
          width="1920"
          height="1200"
          alt=""
        />
        <img
          class="hidden w-full rounded-lg dark:block"
          src="images/product-dashboard-dark.webp"
          width="1920"
          height="1200"
          loading="lazy"
          alt=""
        />
      </div>
    </aside>

    <div class="flex min-w-0 flex-col gap-8 px-4 py-6 sm:px-10">
      <div class="flex items-center justify-between gap-4 lg:justify-end">
        <a routerLink="/" class="flex items-center gap-2 text-sm font-semibold lg:hidden">
          <app-logo />
          {{ t('account.brand.title') }}
        </a>
        <div class="flex gap-2 md:gap-4">
          <app-theme-mode-toggle />
          <!--#if (IncludeLocalization)-->
          @if (showLanguageSwitcher()) {
            <app-language-switcher />
          }
          <!--#endif-->
        </div>
      </div>

      <!-- 表单直接放在右栏，不再套卡片：左右分栏本身已经划出了区域 -->
      <div class="flex flex-1 items-center justify-center">
        <div
          class="flex w-full flex-col gap-6"
          [class.max-w-sm]="width() === 'default'"
          [class.max-w-xl]="width() === 'wide'"
        >
          <ng-content />
          <ng-content select="[authShellFooter]" />
        </div>
      </div>

      <p class="text-muted-foreground text-xs">© {{ year }} {{ t('account.brand.title') }}</p>
    </div>
  </div>
</ng-container>
