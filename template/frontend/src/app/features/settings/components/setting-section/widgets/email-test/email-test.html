<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <!-- 独立的操作卡：与设置分组同级，不嵌在分组卡里 -->
  <section hlmCard data-testid="email-test">
    <div hlmCardHeader>
      <h4 hlmCardTitle>{{ t('settings.emailTest.title') }}</h4>
      <p hlmCardDescription>{{ t('settings.emailTest.description') }}</p>
    </div>
    <form
      hlmCardContent
      class="flex flex-col gap-2 @md/panel:flex-row"
      novalidate
      (submit)="$event.preventDefault(); send()"
    >
      <input
        hlmInput
        type="email"
        autocomplete="email"
        class="@md/panel:max-w-sm @md/panel:flex-1"
        data-testid="email-test-to"
        [attr.aria-label]="t('settings.emailTest.recipient')"
        [placeholder]="t('settings.emailTest.recipient')"
        [value]="to()"
        (input)="to.set($any($event.target).value)"
      />
      <button hlmBtn type="submit" data-testid="email-test-send" [disabled]="!canSend()">
        @if (sending()) {
          <hlm-spinner class="text-base" data-icon="inline-start" />
        } @else {
          <ng-icon name="lucideSend" data-icon="inline-start" />
        }
        {{ t('settings.emailTest.send') }}
      </button>
    </form>
  </section>
</ng-container>
