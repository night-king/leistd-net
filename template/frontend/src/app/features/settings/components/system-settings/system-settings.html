<!--#if (IncludeLocalization)-->
<ng-container *transloco="let t">
<!--#else-->
<ng-container>
<!--#endif-->
  <app-settings-shell
    [heading]="t('settings.system.title')"
    [description]="t('settings.system.description')"
    [panels]="panels()"
    [navLabel]="t('settings.navigation')"
    [openNavLabel]="t('settings.openNavigation')"
  >
    <!-- 面板清单来自设置快照：首次加载失败时没有面板可进，错误态与重试只能由这里给出。
         已进入某个面板时由面板自己显示，不重复。 -->
    @if (loadError(); as error) {
      <div class="flex flex-col items-start gap-2" data-testid="settings-load-error">
        <p class="text-sm font-medium" role="alert">{{ t('settings.loadFailed') }}</p>
        <p class="text-muted-foreground text-sm">{{ error }}</p>
        <button hlmBtn variant="outline" [disabled]="loading()" (click)="reload()">
          {{ t('common.retry') }}
        </button>
      </div>
    } @else if (noPanels()) {
      <!-- 只有入口权限、没有任何分组的管理子权限：页面进得来，但没有可管理的设置 -->
      <div class="flex flex-col items-start gap-1" data-testid="settings-empty">
        <p class="text-sm font-medium">{{ t('settings.system.empty') }}</p>
        <p class="text-muted-foreground text-sm">{{ t('settings.system.emptyHint') }}</p>
      </div>
    }
  </app-settings-shell>
</ng-container>
