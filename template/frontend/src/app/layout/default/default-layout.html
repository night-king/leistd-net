<div hlmSidebarWrapper data-layout="default" class="h-svh">
  <!-- 侧边栏（inset 变体）：桌面端侧栏与四周同为画布色，主内容区浮成圆角面板；桌面折叠为图标轨，移动端渲染为 sheet。 -->
  <app-default-sidebar />

  <!-- 主内容区：Header + 内容。inset 所需的 peer 与状态属性由 app-default-sidebar 的宿主转出。 -->
  <main hlmSidebarInset class="overflow-hidden">
    <app-default-header />

    <div class="flex-1 overflow-auto motion-safe:scroll-smooth">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-command-palette />
</div>
